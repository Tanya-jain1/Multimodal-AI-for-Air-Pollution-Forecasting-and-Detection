<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi AQI Monitor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h1 { color: #333; margin-bottom: 5px; font-size: 22px; }
        .location { color: #888; margin-bottom: 25px; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;}
        
        .card-container { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 25px; }
        .card { flex: 1; padding: 15px; background: #f9f9f9; border-radius: 12px; border: 1px solid #eee; }
        .card h3 { font-size: 12px; color: #777; margin: 0 0 5px 0; text-transform: uppercase; }
        .card .value { font-size: 28px; font-weight: bold; color: #222; }
        .card .unit { font-size: 12px; color: #999; }

        .big-prediction { padding: 25px; border-radius: 15px; color: white; margin-bottom: 25px; transition: 0.3s; }
        .big-prediction h2 { margin: 0; font-size: 14px; opacity: 0.9; letter-spacing: 1px; }
        .big-prediction .status { font-size: 24px; font-weight: 700; text-transform: uppercase; margin-top: 5px; }

        .refresh-btn { background-color: #2c3e50; color: white; border: none; padding: 12px 25px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .refresh-btn:hover { background-color: #1a252f; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>AQI Forecaster</h1>
        <div class="location">📍 {{ city }}</div>

        <div class="card-container">
            <div class="card">
                <h3>Current AQI</h3>
                <div class="value">{{ current }}</div>
                <div class="unit">Real-time</div>
            </div>
            <div class="card">
                <h3>Next Hour</h3>
                <div class="value">{{ forecast }}</div>
                <div class="unit">Prediction</div>
            </div>
        </div>

        <div class="big-prediction" style="background-color: {{ color }}; box-shadow: 0 10px 20px {{ color }}40;">
            <h2>FORECAST STATUS</h2>
            <div class="status">{{ status }}</div>
        </div>

        <button class="refresh-btn" onclick="location.reload()">🔄 Update Analysis</button>
    </div>

</body>
</html>
